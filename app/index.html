<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cebim</title>
  <meta name="description" content="Borç, fatura ve maaş takibi">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cebim">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="month-nav" id="month-nav">
      <button class="icon-btn" data-act="prev-month" aria-label="Önceki ay">‹</button>
      <button class="month-title" data-act="this-month" id="month-title"></button>
      <button class="icon-btn" data-act="next-month" aria-label="Sonraki ay">›</button>
    </div>
    <h1 class="page-title" id="page-title"></h1>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button data-tab="summary"><span class="ti">◉</span><span>Özet</span></button>
    <button data-tab="items"><span class="ti">☰</span><span>Kalemler</span></button>
    <button class="fab" data-act="quick-add" aria-label="Ekle">+</button>
    <button data-tab="debts"><span class="ti">🏦</span><span>Borçlar</span></button>
    <button data-tab="settings"><span class="ti">⚙︎</span><span>Ayarlar</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
